[project]
name = "emprendimiento"
version = "2.0.0"
description = "Perfiles motivacionales de emprendedores: psicometría, cuestionario corto y segmentación reproducible."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Tomás Carmona" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    # factor-analyzer 0.5.1 (última versión, feb-2024) llama a check_array(force_all_finite=...),
    # argumento eliminado en scikit-learn 1.8 (issue #147 del repo de factor_analyzer).
    # Por eso se fija scikit-learn a la serie 1.7.
    "scikit-learn>=1.7,<1.8",
    "factor-analyzer==0.5.1",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[project.scripts]
emprende = "emprendimiento.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Lo que Quarto necesita para ejecutar las celdas de Python del reporte.
# Quarto (el binario) no es un paquete de Python: ver README.
reporte = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "jupyter-core>=5.7",
    "tabulate>=0.9",  # tablas en markdown desde pandas
]

[tool.uv]
default-groups = ["dev", "reporte"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emprendimiento"]

# ── Calidad de código ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
# RUF001-003: caracteres "ambiguos" (tildes, rayas, comillas tipográficas) son
# legítimos en textos y docstrings en español.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # factor_analyzer 0.5.1 + scikit-learn 1.7: aviso conocido, ver comentario en dependencies.
    "ignore:'force_all_finite' was renamed:FutureWarning",
]
