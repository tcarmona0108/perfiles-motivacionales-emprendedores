name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tests y pipeline (datos sintéticos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3  # sin etiqueta móvil "v10": versión exacta
        with:
          enable-cache: true

      - name: Instalar dependencias exactas (uv.lock)
        run: uv sync --locked

      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      # Quarto hace falta porque `emprende all` termina renderizando el reporte.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # Prueba de humo: el pipeline completo corre de punta a punta con los
      # datos sintéticos versionados (los reales nunca están en la CI).
      # --rapido usa ~10 % de las iteraciones: verifica que todo corre, no
      # produce los números oficiales.
      - name: Pipeline completo (modo rápido)
        run: uv run emprende all --fuente sintetico --rapido
